<!DOCTYPE html>
<!--
	--- BOOT: la página del juego (html/custom_html_shell en export_presets.cfg). Es la de Godot 4.7.2
	(godot.html de la plantilla web) con estos cambios:
	- el fondo de la página es el color de la imagen de arranque (#0d0a17 = application/boot_splash/bg_color),
	  no negro: de la página a la pantalla de carga del juego y al título no hay saltos de color;
	- la barra de progreso tiene la forma, el color y el sitio de la del juego (scripts/boot_screen.gd: al 90 % del alto,
	  la mitad del ancho, dorada): la página la llena hasta el 42 % mientras baja el juego y el juego sigue desde ahí;
	- cuando termina la descarga, un brillo recorre la barra («arrancando»): es una animación CSS de transform, que el
	  navegador mueve aunque el hilo principal esté ocupado arrancando el motor;
	- el motor arranca dos cuadros después (requestAnimationFrame), para que ese brillo llegue a pintarse antes de la
	  tarea larga del arranque.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Midnight Cauldron</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0d0a17;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0d0a17;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress, #status-shimmer {
	bottom: 10%;
	width: 50%;
	height: 1.05vh;
	min-height: 4px;
	margin: 0 auto;
}

#status-progress {
	-webkit-appearance: none;
	appearance: none;
	border: 0;
	border-radius: 0;
	outline: 1px solid rgba(255, 219, 128, 0.28);
	outline-offset: 1px;
	background: rgba(255, 255, 255, 0.07);
	color: #ffdb80;
}

#status-progress::-webkit-progress-bar {
	background: rgba(255, 255, 255, 0.07);
}

#status-progress::-webkit-progress-value {
	background: #ffdb80;
}

#status-progress::-moz-progress-bar {
	background: #ffdb80;
}

#status-shimmer {
	position: absolute;
	left: 0;
	right: 0;
	overflow: hidden;
	display: none;
	pointer-events: none;
}

#status-shimmer::after {
	content: '';
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 25%;
	background: linear-gradient(90deg, rgba(255, 244, 214, 0), rgba(255, 244, 214, 0.75), rgba(255, 244, 214, 0));
	transform: translateX(-100%);
	animation: status-shimmer 1.1s ease-in-out infinite;
	will-change: transform;
}

@keyframes status-shimmer {
	from { transform: translateX(-100%); }
	to { transform: translateX(400%); }
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta property='og:title' content='Midnight Cauldron'><meta property='og:description' content='A little potion shop for adventurers.'><script>document.title = 'Midnight Cauldron';</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-shimmer"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4476136,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusShimmer = document.getElementById('status-shimmer');
	const WEB_START = 42; // --- BOOT: hasta aquí llena la página la barra (el juego sigue desde 0.42: BootScreen.WEB_START)
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusShimmer.style.display = 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		statusProgress.max = 100;
		statusProgress.value = 0;
		// --- BOOT: el motor arranca dos cuadros después (la barra y su brillo ya pintados antes de la tarea larga)
		const engineStart = engine.start.bind(engine);
		engine.start = function (...args) {
			statusShimmer.style.display = 'block';
			return new Promise((resolve) => {
				requestAnimationFrame(() => requestAnimationFrame(() => resolve()));
			}).then(() => engineStart(...args));
		};
		engine.startGame({
			'onProgress': function (current, total) {
				// --- BOOT: la descarga llena la barra hasta WEB_START; al terminar, el brillo de «arrancando»
				statusProgress.max = 100;
				statusProgress.value = (current > 0 && total > 0) ? WEB_START * Math.min(1, current / total) : 0;
				if (total > 0 && current >= total) {
					statusShimmer.style.display = 'block';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
