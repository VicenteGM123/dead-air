@font-face {
	font-family: 'Cinzel';
	src: url('fonts/Cinzel-SemiBold.ttf') format('truetype');
	font-weight: 600;
	font-display: block;
}

@font-face {
	font-family: 'Cinzel';
	src: url('fonts/Cinzel-Regular.ttf') format('truetype');
	font-weight: 400;
	font-display: block;
}

/* Palette of the art direction brief: night indigo (the body of Nyx), UI ivory and gold, amber lantern flame. */
:root {
	--night-top: #0A0D26;
	--night-bottom: #241B45;
	--ivory: #F7F1E3;
	--gold: #E9C46A;
	--gold-soft: rgba(233, 196, 106, 0.66);
	--gold-faint: rgba(233, 196, 106, 0.15);
	--display: 'Cinzel', 'Trajan Pro', 'Cormorant SC', Georgia, 'Times New Roman', serif;
	--text: 'EB Garamond', Garamond, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
	--beam-width: min(300px, 64vw);
}

html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: var(--night-top);
	overscroll-behavior: none;
}

body {
	position: fixed;
	inset: 0;
	color: var(--ivory);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
	text-size-adjust: 100%;
}

#canvas {
	display: block;
	position: absolute;
	top: 0;
	left: 0;
	margin: 0;
	padding: 0;
	border: 0;
	outline: none;
	touch-action: none;
}

/* --- loading screen ------------------------------------------------------------------------------------- */

#status {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: flex-start;
	padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
		max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
	box-sizing: border-box;
	overflow: hidden;
	background:
		radial-gradient(ellipse 50% 40% at 50% 36%, rgba(255, 196, 110, 0.08), rgba(255, 196, 110, 0) 70%),
		linear-gradient(180deg, var(--night-top) 0%, #131336 55%, var(--night-bottom) 100%);
	transition: opacity 1s ease;
}

/* A few faint stars. */
#status::before {
	content: '';
	position: absolute;
	inset: 0;
	pointer-events: none;
	opacity: 0.55;
	background-image:
		radial-gradient(1px 1px at 12% 18%, #F4F1FF 50%, transparent 51%),
		radial-gradient(1px 1px at 27% 62%, #CBD5E6 50%, transparent 51%),
		radial-gradient(1.5px 1.5px at 41% 11%, #F4F1FF 50%, transparent 51%),
		radial-gradient(1px 1px at 63% 24%, #CBD5E6 50%, transparent 51%),
		radial-gradient(1px 1px at 78% 9%, #F4F1FF 50%, transparent 51%),
		radial-gradient(1.5px 1.5px at 86% 41%, #F4F1FF 50%, transparent 51%),
		radial-gradient(1px 1px at 7% 47%, #CBD5E6 50%, transparent 51%),
		radial-gradient(1px 1px at 93% 73%, #F4F1FF 50%, transparent 51%),
		radial-gradient(1px 1px at 18% 86%, #CBD5E6 50%, transparent 51%),
		radial-gradient(1px 1px at 71% 83%, #F4F1FF 50%, transparent 51%),
		radial-gradient(1px 1px at 55% 92%, #CBD5E6 50%, transparent 51%),
		radial-gradient(1.5px 1.5px at 33% 31%, #F4F1FF 50%, transparent 51%);
}

/* The sea: a darker band under a faint horizon, with the light of the flame reflected in it. */
#status::after {
	content: '';
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 17%;
	pointer-events: none;
	background:
		linear-gradient(90deg, rgba(233, 196, 106, 0) 8%, rgba(233, 196, 106, 0.16) 50%, rgba(233, 196, 106, 0) 92%) top / 100% 1px no-repeat,
		radial-gradient(ellipse 3.5% 95% at 50% 0%, rgba(255, 214, 140, 0.20), rgba(255, 214, 140, 0) 100%),
		radial-gradient(ellipse 30% 60% at 50% 0%, rgba(255, 190, 110, 0.06), rgba(255, 190, 110, 0) 100%),
		linear-gradient(180deg, rgba(5, 7, 22, 0.42) 0%, rgba(5, 7, 22, 0.72) 100%);
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status[hidden] {
	display: none;
}

.content {
	position: relative;
	z-index: 1;
	margin: auto 0; /* centred, but scrolls from the top when it does not fit (error notices on small screens) */
	display: flex;
	flex-direction: column;
	align-items: center;
	text-align: center;
	animation: rise 1.4s ease-out both;
}

.flame {
	position: relative;
	width: 50px;
	height: 74px;
	margin-bottom: clamp(12px, 3vh, 26px);
}

.flame .halo {
	position: absolute;
	left: 50%;
	top: 58%;
	width: 220px;
	height: 220px;
	margin: -110px 0 0 -110px;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(255, 227, 163, 0.40) 0%, rgba(242, 168, 59, 0.15) 32%, rgba(242, 168, 59, 0) 68%);
	animation: breathe 3.4s ease-in-out infinite;
	will-change: transform, opacity;
}

.flame svg {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: visible;
}

.flame .outer {
	transform-origin: 50% 92%;
	animation: flicker 2.6s ease-in-out infinite;
}

.flame .inner {
	transform-origin: 50% 94%;
	animation: flicker-core 1.7s ease-in-out infinite;
}

.title {
	margin: 0;
	padding-left: 0.3em; /* balances the trailing letter-spacing */
	font-family: var(--display);
	font-weight: 600;
	font-size: clamp(2.4rem, 9vw, 5.2rem);
	line-height: 1;
	letter-spacing: 0.3em;
	color: var(--ivory);
	text-shadow: 0 0 24px rgba(255, 190, 100, 0.28), 0 0 2px rgba(255, 228, 180, 0.35);
}

.subtitle {
	margin: clamp(10px, 1.8vh, 16px) 0 0;
	padding-left: 0.42em;
	font-family: var(--display);
	font-weight: 400;
	font-size: clamp(0.78rem, 2.4vw, 1.05rem);
	letter-spacing: 0.42em;
	color: var(--gold);
	opacity: 0.9;
}

/* The progress bar is a thin lighthouse beam. */
.beam {
	position: relative;
	width: var(--beam-width);
	height: 2px;
	margin-top: clamp(28px, 7vh, 58px);
	border-radius: 2px;
	background: linear-gradient(90deg, rgba(233, 196, 106, 0) 0%, var(--gold-faint) 12%, var(--gold-faint) 88%, rgba(233, 196, 106, 0) 100%);
}

.beam .fill {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 0;
	border-radius: 2px;
	background: linear-gradient(90deg, rgba(233, 196, 106, 0) 0%, rgba(233, 196, 106, 0.78) 55%, #FFE3A3 100%);
	box-shadow: 0 0 10px rgba(255, 190, 100, 0.55);
	transition: width 0.3s ease-out;
}

/* The light at the head of the beam. */
.beam .fill::after {
	content: '';
	position: absolute;
	right: -8px;
	top: 50%;
	width: 16px;
	height: 16px;
	margin-top: -8px;
	border-radius: 50%;
	background: radial-gradient(circle, #FFF7E2 0%, rgba(255, 227, 163, 0.75) 30%, rgba(242, 168, 59, 0) 70%);
}

/* While the engine starts (the page is busy) a light sweeps along the beam; transform-only, so the browser keeps
   animating it even while the main thread is blocked. */
.beam .sweep {
	position: absolute;
	top: -4px;
	left: 0;
	width: 34%;
	height: 10px;
	opacity: 0;
	background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 244, 214, 0.95), rgba(255, 200, 120, 0) 100%);
	transition: opacity 0.4s ease;
	will-change: transform;
}

#status.init .beam .sweep,
#status.indeterminate .beam .sweep {
	opacity: 1;
	animation: sweep 1.9s ease-in-out infinite;
}

.status-text {
	min-height: 1.5em;
	margin: 16px 0 0;
	padding-left: 0.3em;
	font-family: var(--display);
	font-weight: 400;
	font-size: 0.72rem;
	letter-spacing: 0.3em;
	text-transform: uppercase;
	color: var(--gold-soft);
	font-variant-numeric: tabular-nums;
	transition: color 0.6s ease;
}

/* Loaded, waiting for the first click / tap / key (browsers only start the sound after one). */
#status.ready {
	cursor: pointer;
}

#status.ready .status-text {
	color: var(--gold);
	animation: call 2.4s ease-in-out infinite;
}

#status.ready .flame .halo {
	animation-duration: 2.2s;
}

.hint {
	display: none;
	max-width: 22rem;
	margin: 22px 0 0;
	font-family: var(--text);
	font-style: italic;
	font-size: 0.9rem;
	line-height: 1.4;
	color: rgba(247, 241, 227, 0.5);
}

.hint.show {
	display: block;
}

/* --- errors -------------------------------------------------------------------------------------------- */

.notice {
	max-width: 32rem;
	margin: clamp(26px, 6vh, 48px) 4px 0;
	padding: 20px 22px;
	box-sizing: border-box;
	border: 1px solid rgba(233, 196, 106, 0.32);
	border-radius: 12px;
	background: rgba(10, 13, 38, 0.8);
	box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
	font-family: var(--text);
	font-size: 1.05rem;
	line-height: 1.5;
	color: #EDE3CF;
	text-align: center;
	-webkit-user-select: text;
	user-select: text;
}

.notice[hidden] {
	display: none;
}

.notice h2 {
	margin: 0 0 8px;
	font-family: var(--display);
	font-weight: 600;
	font-size: 1.05rem;
	letter-spacing: 0.12em;
	color: var(--gold);
}

.notice p {
	margin: 0;
}

.notice details {
	margin-top: 12px;
	font-size: 0.8rem;
	color: rgba(237, 227, 207, 0.6);
}

.notice details[hidden] {
	display: none;
}

.notice summary {
	cursor: pointer;
}

.notice pre {
	margin: 8px 0 0;
	max-height: 9rem;
	overflow: auto;
	white-space: pre-wrap;
	word-break: break-word;
	text-align: left;
	font-size: 0.75rem;
}

.notice button {
	margin-top: 16px;
	padding: 10px 22px;
	border: 1px solid rgba(233, 196, 106, 0.55);
	border-radius: 999px;
	background: rgba(233, 196, 106, 0.08);
	color: var(--gold);
	font-family: var(--display);
	font-weight: 600;
	font-size: 0.75rem;
	letter-spacing: 0.22em;
	text-transform: uppercase;
	cursor: pointer;
	touch-action: manipulation;
}

.notice button:hover,
.notice button:focus-visible {
	background: rgba(233, 196, 106, 0.18);
	outline: none;
}

#status.error .beam,
#status.error .status-text,
#status.error .hint {
	display: none;
}

#status.error {
	overflow-y: auto;
	touch-action: pan-y;
}

#status.error .flame .outer,
#status.error .flame .inner,
#status.error .flame .halo {
	animation-play-state: paused;
	opacity: 0.45;
}

noscript p {
	position: fixed;
	left: 16px;
	right: 16px;
	bottom: 12%;
	z-index: 20;
	margin: 0;
	font-family: var(--text);
	text-align: center;
	color: #EDE3CF;
}

/* Short landscape phones: tighter spacing so everything fits above the fold. */
@media (max-height: 440px) {
	.flame {
		width: 36px;
		height: 54px;
		margin-bottom: 8px;
	}
	.title {
		font-size: clamp(2rem, 7vw, 3rem);
	}
	.beam {
		margin-top: 22px;
	}
	.status-text {
		margin-top: 12px;
	}
	.hint {
		margin-top: 10px;
	}
	.notice {
		margin-top: 14px;
		padding: 14px 18px;
		font-size: 0.95rem;
		line-height: 1.4;
	}
	.notice button {
		margin-top: 10px;
	}
	#status.error .flame {
		display: none;
	}
	#status.error .title {
		font-size: 1.9rem;
	}
	#status.error .subtitle {
		margin-top: 6px;
	}
}

/* --- motion ------------------------------------------------------------------------------------------- */

@keyframes rise {
	from { opacity: 0; transform: translateY(10px); }
	to { opacity: 1; transform: none; }
}

@keyframes breathe {
	0%, 100% { opacity: 0.62; transform: scale(0.9); }
	50% { opacity: 1; transform: scale(1.08); }
}

@keyframes flicker {
	0%, 100% { transform: scale(1, 1) rotate(0deg); }
	22% { transform: scale(0.96, 1.05) rotate(-1.6deg); }
	48% { transform: scale(1.03, 0.97) rotate(0.6deg); }
	74% { transform: scale(0.98, 1.03) rotate(1.4deg); }
}

@keyframes flicker-core {
	0%, 100% { transform: scale(1, 1); opacity: 0.95; }
	35% { transform: scale(0.92, 1.08); opacity: 1; }
	70% { transform: scale(1.05, 0.95); opacity: 0.85; }
}

@keyframes sweep {
	0% { transform: translateX(-50%); }
	100% { transform: translateX(250%); }
}

@keyframes call {
	0%, 100% { opacity: 0.6; }
	50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
	.content, .flame .halo, .flame .outer, .flame .inner, #status.init .beam .sweep, #status.indeterminate .beam .sweep,
	#status.ready .status-text {
		animation: none;
	}
	#status {
		transition: none;
	}
}

		ev.stopImmediatePropagation();
		showNotice('Se ha apagado la luz',
			'El navegador ha perdido el contexto gráfico (WebGL), algo que puede pasar al cambiar de aplicación o si '
			+ 'falta memoria. Recarga la página para volver a la isla.', '', 'Recargar');
	}, true);

	// A crash of the engine itself (WebAssembly trap or abort) freezes the canvas: explain it.
	window.addEventListener('error', (ev) => {
		const err = ev.error;
		const msg = String((err && err.message) || ev.message || '');
		if ((err instanceof WebAssembly.RuntimeError) || /^(Uncaught )?(RuntimeError|Aborted\()/.test(msg)) {
			showNotice('El faro se ha apagado de golpe',
				'El juego ha sufrido un error interno. Recarga la página para volver a empezar; si se repite, '
				+ 'prueba con otro navegador.', errorDetail(err || msg), 'Recargar');
		}
	});

	// Fade the loading screen out over the running game.
	function reveal() {
		if (failed || shell.revealedAt !== null) {
			return;
		}
		shell.revealedAt = performance.now();
		status.classList.add('done');
		canvas.focus();
		window.setTimeout(() => {
			if (!failed) {
				status.hidden = true;
				status.classList.remove('init', 'indeterminate', 'ready');
			}
		}, 1050);
	}

	// The game is running but the browser keeps it silent until the player interacts: wait for that first click /
	// tap / key on the loading screen, start the sound with it and reveal the island with its music. That first
	// input is consumed (capture phase) so it does not also press something on the title screen; later ones keep
	// retrying the unlock (iOS only honours some gestures) until the sound runs.
	function waitForInput() {
		shell.waitedForInput = true;
		setPhase('ready');
		const events = ['pointerup', 'touchend', 'click', 'keydown'];
		const contexts = () => (window.pharosAudioContexts || []).filter((ctx) => ctx.state === 'suspended');
		const stop = () => {
			for (const e of events) {
				window.removeEventListener(e, onInput, true);
			}
		};
		function onInput(ev) {
			if (failed) {
				stop();
				return;
			}
			if (ev.type === 'keydown' && (ev.repeat || ev.key === 'Tab' || ev.key === 'Escape' || ev.ctrlKey || ev.metaKey || ev.altKey)) {
				return;
			}
			for (const ctx of contexts()) {
				ctx.resume().then(() => {
					if (contexts().length === 0) {
						stop();
					}
				}, () => {});
			}
			if (shell.revealedAt === null) {
				ev.stopPropagation();
				if (ev.type === 'keydown') {
					ev.preventDefault();
				}
				reveal();
			} else if (contexts().length === 0) {
				stop();
			}
		}
		for (const e of events) {
			window.addEventListener(e, onInput, true);
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const has = (prefix) => missing.some((m) => m.indexOf(prefix) === 0);
		if (has('WebGL2')) {
			showNotice('Tu navegador no puede dibujar la isla',
				'PHAROS necesita WebGL 2. Actualiza el navegador (Chrome, Edge, Firefox o Safari 15 o posterior) y '
				+ 'comprueba que la aceleración por hardware está activada en sus ajustes.', missing.join('\n'));
		} else if (has('Secure Context')) {
			showNotice('Abre el juego desde su dirección web',
				'Por seguridad, el navegador solo permite cargar el juego desde una página https:// (o desde '
				+ 'localhost). No funciona abriendo el archivo index.html directamente.', missing.join('\n'));
		} else {
			showNotice('Tu navegador no puede ejecutar PHAROS',
				'Faltan funciones necesarias. Prueba con la última versión de Chrome, Edge, Firefox o Safari.',
				missing.join('\n'));
		}
		return;
	}

	const engine = new Engine(GODOT_CONFIG);
	setPhase('download');
	engine.startGame({
		'onProgress': onProgress,
		'onExit': function (code) {
			if (failed) {
				return;
			}
			if (code !== 0) {
				showNotice('No se ha podido encender el faro',
					'El motor del juego se ha detenido al arrancar. Recarga la página; si se repite, prueba con otro '
					+ 'navegador o activa la aceleración por hardware.', `Código de salida: ${code}`, 'Recargar');
			} else {
				showNotice('El faro descansa', 'La partida ha terminado.', '', 'Volver a jugar');
			}
		},
	}).then(() => {
		// startGame() resolves once the engine has run its first frame (main scene ready and drawn).
		shell.startedAt = performance.now();
		if (shell.downloadedAt === null) {
			shell.downloadedAt = shell.startedAt;
		}
		if (failed) {
			return;
		}
		requestAnimationFrame(() => {
			const silent = (window.pharosAudioContexts || []).some((ctx) => ctx.state === 'suspended');
			if (silent) {
				waitForInput();
			} else {
				reveal();
			}
		});
	}, (err) => {
		console.error(err);
		const offline = typeof navigator.onLine === 'boolean' && !navigator.onLine;
		showNotice('No se ha podido cargar el juego',
			offline ? 'Parece que no hay conexión a internet. Comprueba la conexión y vuelve a intentarlo.'
				: 'Algo ha fallado al descargar o iniciar el juego. Vuelve a intentarlo; si el problema continúa, '
				+ 'prueba con otro navegador.', errorDetail(err));
	});
}());
		</script>
	</body>
</html>
