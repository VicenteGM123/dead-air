<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Dead Air</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":73798400,"index.wasm":38820072},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
GODOT_CONFIG['onProgress'] = (current, total) => window.daOnProgress && window.daOnProgress(current, total);
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// DEAD AIR: two builds of one game share index.pck / index.props.pck (godot/web/export_web.sh):
	//   index.html     threaded (audio mixed off the main thread, background loading); needs a cross-origin isolated
	//                  page: GitHub Pages sends no COOP/COEP headers, so web/coi-sw.js (a service worker) adds them;
	//                  it is registered on the first visit and the page reloads once it is in control.
	//   index-st.html  single-threaded fallback (no service worker possible: private windows, old browsers, http).
	// URL params become game params (index.html?hitch=150&dynres=0 -> -- hitch=150 dynres=0), like the JS game's.
	const COI_KEY = 'deadair-coi-reload';
	function storage(op, v) {
		try {
			if (op === 'get') {
				return window.sessionStorage.getItem(COI_KEY);
			}
			if (op === 'set') {
				window.sessionStorage.setItem(COI_KEY, v);
			} else {
				window.sessionStorage.removeItem(COI_KEY);
			}
		} catch (e) {
			return op === 'get' ? '1' : null;   // no storage: never risk a reload loop
		}
		return null;
	}
	function singleThreaded() {
		window.location.replace(`index-st.html${window.location.search}${window.location.hash}`);
	}
	if (GODOT_THREADS_ENABLED && !window.crossOriginIsolated) {
		setStatusMode('progress');
		if (window.isSecureContext && 'serviceWorker' in navigator && storage('get') !== '1') {
			storage('set', '1');
			navigator.serviceWorker.register('coi-sw.js').then((reg) => {
				const reload = () => window.location.reload();
				if (navigator.serviceWorker.controller) {
					reload();   // already installed (this load bypassed it, e.g. a hard reload)
					return;
				}
				navigator.serviceWorker.addEventListener('controllerchange', reload);
				const sw = reg.installing || reg.waiting || reg.active;
				if (sw && sw.state === 'activated') {
					reload();
				}
				window.setTimeout(singleThreaded, 6000);
			}).catch((err) => {
				console.warn('[dead-air] service worker unavailable, single-threaded build:', err);
				singleThreaded();
			});
		} else {
			singleThreaded();
		}
		return;
	}
	storage('remove');

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_THREADS_ENABLED) {
			singleThreaded();
			return;
		}
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		window.daOnProgress = function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		};
		// engine.startGame() plus the extra resource pack: GitHub refuses files over 100 MB, so the game data is split
		// in index.pck + index.props.pck; the extra pack is copied into the virtual file system next to the main pack
		// and game.gd mounts it (ProjectSettings.load_resource_pack) before booting.
		const exe = GODOT_CONFIG['executable'];
		const mainPack = 'index.pck';
		const extraPacks = ['index.props.pck'];
		const userArgs = [];
		new URLSearchParams(window.location.search).forEach((v, k) => userArgs.push(v === '' ? k : `${k}=${v}`));
		Promise.all([mainPack].concat(extraPacks).map((p) => fetch(p, { method: 'HEAD' }).then((r) => {
			const n = parseInt(r.headers.get('content-length') || '0', 10);
			if (r.ok && n > 0) {
				GODOT_CONFIG['fileSizes'][p] = n;
			}
			return r.ok;
		}).catch(() => false))).then((found) => Promise.all([
			engine.init(exe),
			engine.preloadFile(mainPack, mainPack),
		].concat(extraPacks.filter((p, i) => found[i + 1]).map((p) => engine.preloadFile(p, p))))).then(() => engine.start({
			'args': ['--main-pack', mainPack].concat(GODOT_CONFIG['args'] || []).concat(userArgs.length ? ['--'].concat(userArgs) : []),
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
